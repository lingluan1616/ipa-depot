name: Release

# 0.1.0 的发布包由本地 scripts/build-release.sh 构建、验收后手动上传；
# 此工作流仅供手动触发（Actions 页面 Run workflow），不随标签自动运行，避免覆盖已验收的产物。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Fetch ipatool (sha256 verified, universal)
        run: scripts/fetch-ipatool.sh

      - name: Build release packages
        run: scripts/build-release.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            build/release/*.zip
            build/release/*.dmg
            build/release/*.sha256
