name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Fetch ipatool (sha256 verified, universal)
        run: scripts/fetch-ipatool.sh

      - name: Build release packages
        run: scripts/build-release.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            build/release/*.zip
            build/release/*.dmg
            build/release/*.sha256
