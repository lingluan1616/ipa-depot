name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Fetch ipatool (sha256 verified, universal)
        run: scripts/fetch-ipatool.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug)
        run: xcodebuild -scheme IPADepot -configuration Debug -derivedDataPath build/DerivedData build

      - name: Test
        run: xcodebuild test -scheme IPADepotCore -derivedDataPath build/DerivedData
